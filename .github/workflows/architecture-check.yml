name: Architecture Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  architecture-audit:
    name: Architecture Health Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pyyaml pydantic

      - name: Run architecture audit
        run: |
          cd mini-lims-platform
          python scripts/architecture_audit.py

      - name: Check architecture score
        run: |
          cd mini-lims-platform
          python -c "
          import json
          with open('architecture-health.json') as f:
              h = json.load(f)
          print(f'Architecture Score: {h[\"architecture_score\"]}')
          print(f'Critical Issues: {h[\"critical\"]}')
          if h['critical'] > 0:
              raise SystemExit('FAIL: Critical architecture issues found')
          if h['architecture_score'] < 60:
              raise SystemExit('FAIL: Architecture score below minimum threshold (60)')
          print('PASS: Architecture health check passed')
          "

      - name: Upload health report
        uses: actions/upload-artifact@v4
        with:
          name: architecture-health
          path: mini-lims-platform/architecture-health.json


name: Simulation Regression

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  simulation-regression:
    name: Run All Simulation Scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          cd mini-lims-platform
          pip install -r requirements.txt
      - name: Run simulation regression tests
        run: |
          cd mini-lims-platform
          pytest tests/simulation/ -v --tb=short --json-report --json-report-file=simulation-report.json
      - name: Upload simulation report
        uses: actions/upload-artifact@v4
        with:
          name: simulation-report
          path: mini-lims-platform/simulation-report.json


name: Simulation Regression

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  simulation-regression:
    name: Run All Simulation Scenarios (A-I)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run simulation regression tests
        env:
          PYTHONPATH: .
        run: |
          pytest tests/simulation/ -v --tb=short \
            --json-report --json-report-file=simulation-report.json

      - name: Validate all 9 scenarios passed
        run: |
          python -c "
          import json, sys
          with open('simulation-report.json') as f:
              report = json.load(f)
          passed = report.get('summary', {}).get('passed', 0)
          failed = report.get('summary', {}).get('failed', 0)
          print(f'Simulation tests: {passed} passed, {failed} failed')
          if failed > 0:
              print('FAIL: Some simulation scenarios failed')
              sys.exit(1)
          print('PASS: All simulation scenarios passed')
          "

      - name: Upload simulation report
        uses: actions/upload-artifact@v4
        with:
          name: simulation-report
          path: simulation-report.json

name: Simulation Regression

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  simulation-regression:
    name: Run All Simulation Scenarios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-json-report

      - name: Run simulation regression tests
        run: pytest tests/simulation/ -v --tb=short --json-report --json-report-file=simulation-report.json

      - name: Upload simulation report
        uses: actions/upload-artifact@v4
        with:
          name: simulation-report
          path: simulation-report.json

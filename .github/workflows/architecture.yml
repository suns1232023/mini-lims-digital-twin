name: Architecture Audit

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  architecture-audit:
    name: Architecture Health Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade build tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: pip install pyyaml jsonschema

      - name: Run architecture audit
        env:
          PYTHONPATH: .
        run: python scripts/architecture_audit.py

      - name: Enforce quality gate
        run: |
          python -c "
          import json, sys
          with open('architecture-health.json') as f:
              h = json.load(f)
          print(f'Architecture Score: {h[\"architecture_score\"]}/100')
          print(f'Issues: {h[\"issues\"]}  Warnings: {h[\"warnings\"]}  Critical: {h[\"critical\"]}')
          print(f'Note: {h.get(\"note\", \"\")}')
          if h['critical'] > 0:
              print('FAIL: Critical architecture issues found')
              sys.exit(1)
          min_score = 70
          if h['architecture_score'] < min_score:
              print(f'FAIL: Score {h[\"architecture_score\"]} below minimum {min_score}')
              sys.exit(1)
          print('PASS: Architecture health check passed')
          "

      - name: Upload health report
        uses: actions/upload-artifact@v4
        with:
          name: architecture-health
          path: architecture-health.json

name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  unit-and-simulation-tests:
    name: Unit & Simulation Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade build tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install dependencies
        run: |
          pip install pydantic pyyaml jsonschema \
            pytest pytest-asyncio pytest-cov pytest-json-report \
            httpx ruff mypy

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: pytest tests/unit/ -v --tb=short --cov=twin --cov=simulation --cov-report=xml

      - name: Run simulation tests
        env:
          PYTHONPATH: .
        run: pytest tests/simulation/ -v --tb=short

      - name: Run integration tests
        env:
          PYTHONPATH: .
        run: pytest tests/integration/ -v --tb=short

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

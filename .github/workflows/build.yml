name: CI & Quality Gate

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint-and-typecheck:
    name: Python Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install ruff mypy pydantic pyyaml

      - name: Run Ruff Linter
        run: ruff check twin/ simulation/ scripts/ --ignore E501,E401,UP006,UP007,UP017,UP035

      - name: Run Mypy Type Check
        env:
          PYTHONPATH: .
        run: mypy twin/ scripts/ --ignore-missing-imports --explicit-package-bases

  contract-validation:
    name: Validate JSON Contracts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install jsonschema
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install jsonschema

      - name: Validate Contract Schemas
        run: |
          python -c "
          import json, sys
          from pathlib import Path
          contracts_dir = Path('contracts')
          if not contracts_dir.exists():
              print('FAIL: contracts/ directory not found')
              sys.exit(1)
          errors = []
          for f in contracts_dir.glob('*.json'):
              try:
                  data = json.loads(f.read_text())
                  if '\$schema' not in data and '$schema' not in data:
                      errors.append(f'{f.name}: missing schema')
                  else:
                      print(f'OK: {f.name}')
              except json.JSONDecodeError as e:
                  errors.append(f'{f.name}: invalid JSON')
          if errors:
              for e in errors:
                  print(f'ERROR: {e}')
              sys.exit(1)
          print('PASS: All contracts valid')
          "

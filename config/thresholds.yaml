
# Thresholds Configuration — Mini-LIMS Digital Twin Platform
version: "1.0.0"
defaults:
  incubator:
    temperature:
      warning_low: 35.0
      warning_high: 39.0
      alarm_low: 34.0
      alarm_high: 40.0
      unit: celsius
    humidity:
      warning_low: 40.0
      warning_high: 80.0
      unit: percent
  autoclave:
    temperature:
      sterilize_nominal: 121.0
      sterilize_min: 120.0
      sterilize_max: 122.0
      unit: celsius
    pressure:
      sterilize_nominal: 1.05
      sterilize_min: 1.0
      sterilize_max: 1.2
      unit: bar
  environmental_sensor:
    pressure:
      alarm_low: -20.0
      warning_low: -15.0
      nominal: -12.0
      warning_high: -8.0
      alarm_high: -5.0
      unit: pascal
    temperature:
      alarm_low: 18.0
      warning_low: 20.0
      nominal: 22.0
      warning_high: 25.0
      alarm_high: 27.0
      unit: celsius
    humidity:
      alarm_low: 25.0
      warning_low: 30.0
      nominal: 50.0
      warning_high: 65.0
      alarm_high: 70.0
      unit: percent
sensor_timeout:
  critical_assets: 60
  standard_assets: 300
workflow_timeouts:
  sample_registered_to_received: 24
  sample_received_to_prepared: 4
  sample_prepared_to_testing: 2
  sample_testing_to_incubating: 1
  sample_incubating_to_reading: 168
  sample_reading_to_review: 2
  sample_review_to_decision: 8
  sample_approved_to_reported: 4
  alarm_acknowledgement_minutes: 30

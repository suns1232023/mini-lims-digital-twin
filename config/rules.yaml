
# Rules Configuration — Mini-LIMS Digital Twin Platform
version: "1.0.0"
rules:
  - rule_id: INC_TEMP_HIGH
    name: Incubator Temperature High Alarm
    asset_types: [incubator]
    condition: "temperature > alarm_max"
    severity: ALARM
    actions: [create_alarm, mark_excursion, identify_affected_samples, notify_qa]

  - rule_id: INC_TEMP_LOW
    name: Incubator Temperature Low Alarm
    asset_types: [incubator]
    condition: "temperature < alarm_min"
    severity: ALARM
    actions: [create_alarm, mark_excursion, identify_affected_samples, notify_qa]

  - rule_id: PB_INTERLOCK_VIOLATION
    name: Pass Box Interlock Violation
    asset_types: [pass_box]
    condition: "door_a == open AND door_b == open"
    severity: CRITICAL
    actions: [create_alarm, lock_both_doors, notify_qa]

  - rule_id: ENV_PRESSURE_ALARM
    name: Clean Room Pressure Alarm
    asset_types: [environmental_sensor]
    rooms: [R-STERILE, R-YANGXING, R-MICROBIO]
    condition: "pressure > alarm_max"
    severity: ALARM
    actions: [create_alarm, notify_qa, identify_affected_samples]

  - rule_id: AC_TEMP_EXCURSION
    name: Autoclave Temperature Excursion
    asset_types: [autoclave]
    condition: "temperature < sterilize_min OR temperature > sterilize_max"
    severity: CRITICAL
    actions: [create_alarm, trigger_safe_state, notify_qa]

  - rule_id: SENSOR_FAILURE
    name: Sensor Data Timeout
    asset_types: [environmental_sensor, incubator, autoclave]
    condition: "last_reading_age_sec > 60"
    severity: CRITICAL
    actions: [create_alarm, mark_sensor_failed, notify_qa]

  - rule_id: SAMPLE_WORKFLOW_TIMEOUT
    name: Sample Workflow Step Timeout
    entity_types: [sample]
    condition: "step_age_hours > timeout_hours"
    severity: ALARM
    actions: [create_alarm, notify_qa, block_workflow]

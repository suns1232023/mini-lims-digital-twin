
[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# Only enforce critical syntax/logic errors (E, F)
# Suppress style modernization rules that don't affect correctness
select = ["E", "F"]
ignore = [
    "E501",   # Line too long (handled by line-length setting)
    "UP006",  # Use `dict` instead of `Dict` for type annotation
    "UP007",  # Use `X | Y` for union type annotation
    "UP017",  # Use `datetime.UTC` alias (Python 3.11+)
    "UP035",  # Import from `typing` is deprecated
    "F401",   # Module imported but unused (handled by mypy)
]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_return_any = false
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

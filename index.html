<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Mini-LIMS v3 · 微生物实验室数字孪生</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0d14;color:#e6edf3;font-family:'PingFang SC','Microsoft YaHei',sans-serif;overflow:hidden}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:#161b22}
::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}
@keyframes pulseRing{0%{r:7;opacity:0.9}100%{r:16;opacity:0}}
@keyframes flowDash{to{stroke-dashoffset:-16}}
@keyframes fadeIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:translateY(0)}}
.blink{animation:blink 1.1s infinite}
.flow-line{stroke-dasharray:6,4;animation:flowDash 0.8s linear infinite}
.log-item{animation:fadeIn 0.3s ease}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useCallback, useMemo, useRef } = React;

/* ══════════════════════════════════════════════════════════════
   图纸坐标系
   真实图纸：横向 20m（5m洁净 + 7m培养 + 8m理化）
             纵向 约11m（含更衣走廊）
   SVG viewBox: 0 0 1060 620
   换算：1m ≈ 48px(X)，1m ≈ 50px(Y)，原点(12,12)
══════════════════════════════════════════════════════════════ */
const PX = 48, PY = 50, OX = 12, OY = 12;
const gx = m => OX + m * PX;
const gy = m => OY + m * PY;
const gw = m => m * PX;
const gh = m => m * PY;

/* ══════════════════════════════════════════════════════════════
   初始状态
══════════════════════════════════════════════════════════════ */
let _sc = 1;
function createState() {
  return {
    rooms:[
      // 洁净区（X: 0~5m）
      {id:'sterile',  name:'无菌室',         zone:'clean', pressure:-15.0,temp:22.0,humidity:45.0,noise:38,status:'normal',bsl:'BSL-2',grade:'万级 ISO 7'},
      {id:'yangxing', name:'阳性对照操作室', zone:'clean', pressure:-12.0,temp:22.0,humidity:45.0,noise:40,status:'normal',bsl:'BSL-2',grade:'万级 ISO 7'},
      {id:'microbio', name:'微生物操作室',   zone:'clean', pressure:-10.0,temp:22.0,humidity:45.0,noise:42,status:'normal',bsl:'BSL-1',grade:'万级 ISO 7'},
      {id:'buf1',     name:'缓冲间①',        zone:'buffer',pressure:-5.0, temp:23.0,humidity:50.0,noise:35,status:'normal',bsl:'—',   grade:'—'},
      {id:'buf2',     name:'缓冲间②',        zone:'buffer',pressure:-5.0, temp:23.0,humidity:50.0,noise:35,status:'normal',bsl:'—',   grade:'—'},
      {id:'change1',  name:'一更',            zone:'change',pressure:0.0,  temp:24.0,humidity:55.0,noise:40,status:'normal',bsl:'—',   grade:'—'},
      {id:'change2',  name:'二更',            zone:'change',pressure:-2.0, temp:23.5,humidity:52.0,noise:38,status:'normal',bsl:'—',   grade:'—'},
      // 培养区（X: 5~12m）
      {id:'culture',  name:'培养区',          zone:'support',pressure:0.0, temp:37.0,humidity:60.0,noise:45,status:'normal',bsl:'—',   grade:'普通'},
      {id:'hvac',     name:'空调过滤器房',    zone:'support',pressure:2.0, temp:20.0,humidity:40.0,noise:58,status:'normal',bsl:'—',   grade:'—'},
      // 理化/灭菌区（X: 12~20m）
      {id:'chem',     name:'理化实验室',      zone:'support',pressure:0.0, temp:24.0,humidity:55.0,noise:48,status:'normal',bsl:'—',   grade:'普通'},
      {id:'steril',   name:'灭菌区',          zone:'support',pressure:0.0, temp:25.0,humidity:50.0,noise:52,status:'normal',bsl:'—',   grade:'—'},
    ],
    passboxes:[
      {id:'pb1',name:'传递窗①',status:'idle',sample:null,from:'缓冲间①',to:'无菌室',       updated_at:null},
      {id:'pb2',name:'传递窗②',status:'idle',sample:null,from:'缓冲间②',to:'阳性对照操作室',updated_at:null},
      {id:'pb3',name:'传递窗③',status:'idle',sample:null,from:'缓冲间',  to:'微生物操作室', updated_at:null},
    ],
    incubators:[
      {id:'inc1',name:'培养箱①',temp:37.0,setpoint:37.0,status:'running'},
      {id:'inc2',name:'培养箱②',temp:37.0,setpoint:37.0,status:'running'},
      {id:'inc3',name:'培养箱③',temp:37.0,setpoint:37.0,status:'running'},
      {id:'inc4',name:'培养箱④',temp:37.0,setpoint:37.0,status:'idle'},
    ],
    autoclaves:[
      {id:'ac1',name:'灭菌锅①',status:'idle',countdown:0,temp:25.0,cycles:0},
      {id:'ac2',name:'灭菌锅②',status:'idle',countdown:0,temp:25.0,cycles:0},
    ],
    sample_log:[],
    ts:new Date().toISOString(),
  };
}

const BASE_P = {sterile:-15,yangxing:-12,microbio:-10,buf1:-5,buf2:-5,change1:0,change2:-2,culture:0,hvac:2,chem:0,steril:0};

function tick(s) {
  const t = Date.now()/1000;
  const n = JSON.parse(JSON.stringify(s));
  n.rooms = n.rooms.map(r=>{
    const base = BASE_P[r.id]||0;
    const noise = Math.sin(t*0.28+r.id.charCodeAt(0)*0.6)*1.9+(Math.random()-.5)*.5;
    const pressure = Math.round((base+noise)*10)/10;
    const temp = Math.round((r.temp+(Math.random()-.5)*.08)*10)/10;
    const humidity = Math.min(80,Math.max(30,Math.round((r.humidity+(Math.random()-.5)*.15)*10)/10));
    const noise_db = Math.round((r.noise+(Math.random()-.5)*2)*10)/10;
    let status='normal';
    if(['sterile','yangxing','microbio'].includes(r.id)){
      if(pressure>-5) status='alarm';
      else if(pressure>-8) status='warning';
    }
    return {...r,pressure,temp,humidity,noise:noise_db,status};
  });
  n.incubators = n.incubators.map(i=>{
    if(i.status==='idle') return i;
    const temp=Math.round((i.setpoint+Math.sin(t*.18+i.id.charCodeAt(0))*.35+(Math.random()-.5)*.1)*10)/10;
    return {...i,temp,status:Math.abs(temp-i.setpoint)>1.5?'alarm':'running'};
  });
  n.autoclaves = n.autoclaves.map(ac=>{
    if(ac.status==='running'&&ac.countdown>0){
      const cd=ac.countdown-1;
      const temp=Math.round((121+(Math.random()-.5)*.4)*10)/10;
      return {...ac,countdown:cd,temp,status:cd<=0?'cooling':ac.status,...(cd<=0?{countdown:20}:{})};
    } else if(ac.status==='cooling'&&ac.countdown>0){
      const cd=ac.countdown-1;
      const temp=Math.round(Math.max(25,ac.temp-3.5+(Math.random()-.5)*.3)*10)/10;
      return {...ac,countdown:cd,temp,...(cd<=0?{status:'done',temp:25.0,cycles:ac.cycles+1}:{})};
    }
    return ac;
  });
  n.ts=new Date().toISOString();
  return n;
}

/* ══════════════════════════════════════════════════════════════
   颜色系统
══════════════════════════════════════════════════════════════ */
const ZONE_C = {
  clean:  {bg:'#071a0f',border:'#22c55e',bw:2,  lc:'#4ade80'},
  buffer: {bg:'#0a1628',border:'#3b82f6',bw:1.5,lc:'#60a5fa'},
  change: {bg:'#12102a',border:'#6366f1',bw:1.5,lc:'#818cf8'},
  support:{bg:'#0f1520',border:'#374151',bw:1.5,lc:'#6b7280'},
};
const ALARM_C = {
  alarm:  {bg:'#2b0a0a',border:'#ef4444',lc:'#f87171'},
  warning:{bg:'#2b1f00',border:'#f59e0b',lc:'#fbbf24'},
};
const PB_C = {
  idle:        {bg:'#1e293b',border:'#475569',dot:'#64748b'},
  transferring:{bg:'#0d2b1a',border:'#22c55e',dot:'#22c55e'},
  disinfecting:{bg:'#2b1f00',border:'#f59e0b',dot:'#f59e0b'},
  done:        {bg:'#0d2b1a',border:'#4ade80',dot:'#4ade80'},
};
const PB_LBL = {idle:'空闲',transferring:'传递中',disinfecting:'消毒中',done:'完成'};
const INC_C = {idle:'#475569',running:'#22c55e',alarm:'#ef4444'};
const AC_C  = {idle:'#475569',running:'#f59e0b',cooling:'#60a5fa',done:'#4ade80'};

/* ══════════════════════════════════════════════════════════════
   布局定义（严格按图纸比例）
   图纸分区：
     X 0~5m   洁净区（无菌室/阳性对照/微生物/缓冲间/更衣）
     X 5~12m  培养区（培养箱×4 + 冰箱 + 空调过滤器房）
     X 12~20m 理化/灭菌区（通风橱+边台+中央台+灭菌锅×2）
     Y 0~3m   上半（无菌室 / 培养箱上排 / 理化上半）
     Y 3~6.2m 中段（阳性对照 / 培养箱下排 / 理化下半）
     Y 6.2~9.2m 下段（微生物操作室 / 灭菌区）
     Y 9.2~11m  更衣走廊
══════════════════════════════════════════════════════════════ */

// 房间 [id, xm, ym, wm, hm]
const RDEFS = [
  {id:'sterile',  xm:0,   ym:0,   wm:3.0, hm:3.0},
  {id:'yangxing', xm:0,   ym:3.0, wm:3.0, hm:3.2},
  {id:'microbio', xm:0,   ym:6.2, wm:3.0, hm:3.0},
  {id:'buf1',     xm:3.0, ym:0,   wm:2.0, hm:3.0},
  {id:'buf2',     xm:3.0, ym:3.0, wm:2.0, hm:3.2},
  {id:'change1',  xm:0,   ym:9.2, wm:2.5, hm:1.8},
  {id:'change2',  xm:2.5, ym:9.2, wm:2.5, hm:1.8},
  {id:'culture',  xm:5.0, ym:0,   wm:7.0, hm:7.5},
  {id:'hvac',     xm:5.0, ym:7.5, wm:7.0, hm:3.5},
  {id:'chem',     xm:12.0,ym:0,   wm:8.0, hm:6.5},
  {id:'steril',   xm:12.0,ym:6.5, wm:8.0, hm:4.5},
];

// 传递窗 [id, xm, ym]（位于缓冲间与洁净室交界处）
const PBDEFS = [
  {id:'pb1',xm:3.0,ym:1.5,from:'缓冲间①',to:'无菌室'},
  {id:'pb2',xm:3.0,ym:4.6,from:'缓冲间②',to:'阳性对照操作室'},
  {id:'pb3',xm:3.0,ym:7.7,from:'缓冲间',  to:'微生物操作室'},
];

// 培养箱 [id, xm, ym, wm, hm]
const INCDEFS = [
  {id:'inc1',xm:5.3,ym:0.3,wm:2.8,hm:1.5},
  {id:'inc2',xm:8.3,ym:0.3,wm:2.8,hm:1.5},
  {id:'inc3',xm:5.3,ym:2.1,wm:2.8,hm:1.5},
  {id:'inc4',xm:8.3,ym:2.1,wm:2.8,hm:1.5},
];

// 灭菌锅 [key, xm, ym, wm, hm]
const ACDEFS = [
  {idx:0,xm:12.3,ym:7.0,wm:2.5,hm:2.0},
  {idx:1,xm:15.2,ym:7.0,wm:2.5,hm:2.0},
];

// 固定设备（不可交互，仅显示）
const EQUIP = [
  // 百级工作台（洁净室内）
  {label:'百级工作台',xm:0.15,ym:0.15,wm:2.7,hm:0.7,color:'#1e3a5f',tc:'#60a5fa'},
  {label:'百级工作台',xm:0.15,ym:3.15,wm:2.7,hm:0.7,color:'#1e3a5f',tc:'#60a5fa'},
  {label:'百级工作台',xm:0.15,ym:6.35,wm:2.7,hm:0.7,color:'#1e3a5f',tc:'#60a5fa'},
  // 生物安全柜（阳性对照室）
  {label:'生物安全柜',xm:0.15,ym:4.1, wm:1.2,hm:0.7,color:'#1e3a5f',tc:'#60a5fa'},
  // 通风橱（理化室）
  {label:'通风橱(1.5m)',xm:12.15,ym:0.15,wm:1.5,hm:0.8,color:'#2d1b4e',tc:'#a78bfa'},
  // 边台（理化室上下）
  {label:'边台 5m',xm:12.15,ym:1.2, wm:7.7,hm:0.7,color:'#1a2a1a',tc:'#6b7280'},
  {label:'边台 5m',xm:12.15,ym:5.6, wm:7.7,hm:0.7,color:'#1a2a1a',tc:'#6b7280'},
  // 中央台（理化室）
  {label:'中央台 4m×1.5m',xm:13.0,ym:2.5,wm:4.0,hm:1.5,color:'#0f2a1a',tc:'#4ade80'},
  {label:'中央台 4m×1.5m',xm:13.0,ym:4.0,wm:4.0,hm:1.5,color:'#0f2a1a',tc:'#4ade80'},
  // 冰箱（培养区）
  {label:'冰箱',xm:11.2,ym:0.2,wm:0.6,hm:1.0,color:'#1a2a3a',tc:'#60a5fa'},
  // 洗眼器（理化室）
  {label:'洗眼器',xm:19.2,ym:5.0,wm:0.6,hm:0.6,color:'#1a2a3a',tc:'#60a5fa'},
];

// 观察窗（黄色线段）
const WINDEFS = [
  {xm:3.0,y1m:0.7,y2m:1.7},
  {xm:3.0,y1m:3.7,y2m:4.7},
];

// 洗手池（圆形）
const SINKDEFS = [
  {xm:2.65,ym:2.6,label:'洗手池'},
  {xm:2.65,ym:5.8,label:'洗手池'},
];

/* ══════════════════════════════════════════════════════════════
   SVG 平面图
══════════════════════════════════════════════════════════════ */
function LabMap({data, onSelect}) {
  const rmap = useMemo(()=>data?Object.fromEntries(data.rooms.map(r=>[r.id,r])):{}, [data]);
  const pmap = useMemo(()=>data?Object.fromEntries(data.passboxes.map(p=>[p.id,p])):{}, [data]);
  const imap = useMemo(()=>data?Object.fromEntries(data.incubators.map(i=>[i.id,i])):{}, [data]);

  return (
    <svg viewBox="0 0 1060 620" style={{width:'100%',height:'100%',background:'#0a0d14',borderRadius:10}}>
      <defs>
        <filter id="glow"><feGaussianBlur stdDeviation="2.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <filter id="sg"><feGaussianBlur stdDeviation="1.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <marker id="arr" markerWidth="7" markerHeight="7" refX="3.5" refY="3.5" orient="auto">
          <polygon points="0,0 7,3.5 0,7" fill="#22c55e" opacity="0.8"/>
        </marker>
      </defs>

      {/* ── 区域大框 ── */}
      <rect x={gx(0)} y={gy(0)} width={gw(5)} height={gh(9.2)} rx="6"
        fill="none" stroke="#22c55e" strokeWidth="2" strokeDasharray="8,5" opacity="0.22"/>
      <text x={gx(2.5)} y={gy(0)-5} textAnchor="middle" fontSize="11" fill="#22c55e" opacity="0.55" fontWeight="600">洁净控制区（万级 ISO 7）</text>

      <rect x={gx(5)} y={gy(0)} width={gw(7)} height={gh(11)} rx="6"
        fill="none" stroke="#3b82f6" strokeWidth="1.5" strokeDasharray="6,4" opacity="0.18"/>
      <text x={gx(8.5)} y={gy(0)-5} textAnchor="middle" fontSize="11" fill="#3b82f6" opacity="0.5" fontWeight="600">培养区（7m）</text>

      <rect x={gx(12)} y={gy(0)} width={gw(8)} height={gh(11)} rx="6"
        fill="none" stroke="#7c3aed" strokeWidth="1.5" strokeDasharray="6,4" opacity="0.18"/>
      <text x={gx(16)} y={gy(0)-5} textAnchor="middle" fontSize="11" fill="#a78bfa" opacity="0.5" fontWeight="600">理化 / 灭菌区（8m）</text>

      {/* ── 房间 ── */}
      {RDEFS.map(({id,xm,ym,wm,hm})=>{
        const r=rmap[id]; const zone=r?.zone||'support';
        const zc=ZONE_C[zone]||ZONE_C.support;
        const st=r?.status||'normal';
        const ac=ALARM_C[st];
        const bg=ac?ac.bg:zc.bg, border=ac?ac.border:zc.border, lc=ac?ac.lc:zc.lc;
        const isAlarm=st==='alarm', isClean=zone==='clean';
        const rx_=gx(xm),ry_=gy(ym),rw=gw(wm),rh=gh(hm),cx=rx_+rw/2,cy=ry_+rh/2;
        return (
          <g key={id} onClick={()=>r&&onSelect('room',r)} style={{cursor:'pointer'}}>
            <rect className={isAlarm?'blink':''} x={rx_} y={ry_} width={rw} height={rh} rx="5"
              fill={bg} stroke={border} strokeWidth={isAlarm?2.5:zc.bw}/>
            <text x={cx} y={cy-(isClean?16:6)} textAnchor="middle"
              fontSize={wm>4?13:11} fill={lc} fontWeight="700">{r?.name||id}</text>
            {isClean&&r&&(
              <text x={cx} y={cy} textAnchor="middle" fontSize="12"
                fill={st==='alarm'?'#f87171':st==='warning'?'#fbbf24':'#4ade80'} fontWeight="700">
                {r.pressure>0?'+':''}{r.pressure} Pa
              </text>
            )}
            {r&&(
              <text x={cx} y={cy+(isClean?16:8)} textAnchor="middle" fontSize="10" fill="#4b5563">
                {r.temp}℃ · {r.humidity}%RH
              </text>
            )}
            {isClean&&r&&(
              <text x={cx} y={cy+(isClean?30:20)} textAnchor="middle" fontSize="9" fill="#374151">
                {r.noise}dB
              </text>
            )}
            {isClean&&r?.bsl&&r.bsl!=='—'&&(
              <g>
                <rect x={rx_+4} y={ry_+4} width={36} height={14} rx="3" fill={border+'33'} stroke={border} strokeWidth="1"/>
                <text x={rx_+22} y={ry_+14} textAnchor="middle" fontSize="9" fill={border} fontWeight="700">{r.bsl}</text>
              </g>
            )}
            {isAlarm&&(
              <text x={rx_+rw-5} y={ry_+16} textAnchor="end" fontSize="10" fill="#f87171" fontWeight="700" className="blink">⚠ 压差异常</text>
            )}
          </g>
        );
      })}

      {/* ── 固定设备 ── */}
      {EQUIP.map(({label,xm,ym,wm,hm,color,tc},i)=>(
        <g key={i}>
          <rect x={gx(xm)} y={gy(ym)} width={gw(wm)} height={gh(hm)} rx="3"
            fill={color} stroke={tc} strokeWidth="1" opacity="0.85"/>
          <text x={gx(xm)+gw(wm)/2} y={gy(ym)+gh(hm)/2+4} textAnchor="middle"
            fontSize={wm>2?10:9} fill={tc} fontWeight="600">{label}</text>
        </g>
      ))}

      {/* ── 观察窗 ── */}
      {WINDEFS.map(({xm,y1m,y2m},i)=>(
        <g key={i}>
          <line x1={gx(xm)} y1={gy(y1m)} x2={gx(xm)} y2={gy(y2m)}
            stroke="#fbbf24" strokeWidth="5" strokeLinecap="round" opacity="0.75"/>
          <text x={gx(xm)+7} y={gy((y1m+y2m)/2)+4} fontSize="8" fill="#fbbf24" opacity="0.8">观察窗</text>
        </g>
      ))}

      {/* ── 洗手池 ── */}
      {SINKDEFS.map(({xm,ym,label},i)=>(
        <g key={i}>
          <circle cx={gx(xm)} cy={gy(ym)} r="11" fill="#0a1a2e" stroke="#3b82f6" strokeWidth="1.5"/>
          <text x={gx(xm)} y={gy(ym)+4} textAnchor="middle" fontSize="9" fill="#60a5fa">💧</text>
          <text x={gx(xm)+15} y={gy(ym)+4} fontSize="8" fill="#374151">{label}</text>
        </g>
      ))}

      {/* ── 更衣区走廊标注 ── */}
      <rect x={gx(0)} y={gy(9.2)} width={gw(5)} height={gh(1.8)} rx="5"
        fill="#12102a" stroke="#6366f1" strokeWidth="1.5"/>
      <text x={gx(2.5)} y={gy(9.2)+gh(0.9)+4} textAnchor="middle" fontSize="11" fill="#818cf8">一更 / 二更 / 更衣柜 / 洗手池</text>

      {/* ── 传递窗 ── */}
      {PBDEFS.map(({id,xm,ym,from,to})=>{
        const pb=pmap[id]; const st=pb?.status||'idle';
        const col=PB_C[st]||PB_C.idle;
        const isActive=st==='transferring'||st==='disinfecting';
        const cx=gx(xm), cy=gy(ym);
        return (
          <g key={id} onClick={()=>onSelect('passbox',{...pb,from,to})} style={{cursor:'pointer'}}>
            {/* 流向线 */}

const CS = {background:'#161b22',border:'1px solid #21262d',borderRadius:12,padding:24,minWidth:340,maxWidth:480,width:'90vw',boxShadow:'0 24px 64px rgba(0,0,0,0.75)'};
const Btn=({color='#22c55e',disabled,onClick,children})=>(
  <button onClick={onClick} disabled={disabled}
    style={{padding:'8px 18px',borderRadius:6,border:'none',cursor:disabled?'not-allowed':'pointer',
      background:disabled?'#1e293b':color,color:disabled?'#475569':'#fff',fontSize:13,fontWeight:600,opacity:disabled?0.6:1}}>
    {children}
  </button>
);
const Tag=({color,children})=>(
  <span style={{display:'inline-block',padding:'2px 10px',borderRadius:20,background:color+'22',border:`1px solid ${color}`,color,fontSize:12,fontWeight:600}}>{children}</span>

const IR=({label,val,vc})=>(

function AcPanel({ac,onClose,onAction}) {
  const col=AC_C[ac.status]||'#475569';
  const slbl={idle:'待机',running:'灭菌中（121℃）',cooling:'冷却中',done:'完成'}[ac.status]||ac.status;
  const canStart=ac.status==='idle'||ac.status==='done';
  const pct=ac.status==='running'?Math.max(0,100-(ac.countdown/60)*100):ac.status==='cooling'?Math.max(0,100-(ac.countdown/20)*100):0;
  return (
    <div style={CS}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'flex-start',marginBottom:20}}>

          <h3 style={{color:'#e6edf3',fontSize:17,fontWeight:700,marginBottom:8}}>♨️ {ac.name}</h3>

        </div>
        <button onClick={onClose} style={{background:'none',border:'none',color:'#6b7280',cursor:'pointer',fontSize:20}}>✕</button>
      </div>
      <IR label="当前温度" val={`${ac.temp} ℃`} vc={col}/>
      <IR label="剩余时间" val={ac.countdown>0?`${ac.countdown} s`:'—'}/>
      <IR label="累计灭菌次数" val={`${ac.cycles} 次`}/>
      {(ac.status==='running'||ac.status==='cooling')&&(
        <div style={{marginTop:8}}>
          <div style={{height:8,background:'#1e293b',borderRadius:4,overflow:'hidden'}}>
            <div style={{height:'100%',borderRadius:4,background:col,width:`${pct}%`,transition:'width 0.5s'}}/>
          </div>
          <p style={{color:'#6b7280',fontSize:11,marginTop:4}}>{ac.status==='running'?'灭菌进度':'冷却进度'}</p>
        </div>
      )}
      <div style={{display:'flex',gap:10,marginTop:20,justifyContent:'flex-end'}}>
        {canStart&&<Btn color="#f59e0b" onClick={()=>{onAction('ac_start',ac.idx);onClose();}}>▶ 启动灭菌</Btn>}
        {!canStart&&<Btn color="#ef4444" onClick={()=>{onAction('ac_reset',ac.idx);onClose();}}>重置</Btn>}
        <Btn color="#374151" onClick={onClose}>关闭</Btn>
      </div>
    </div>
  );
}

function App() {
  const [state,setState]=useState(createState);
  const [modal,setModal]=useState(null);

  useEffect(()=>{
    const id=setInterval(()=>setState(p=>tick(p)),2000);
    return ()=>clearInterval(id);
  },[]);

  const act=useCallback((type,id,sid,from,to)=>{
    if(type==='transfer'){
      setState(p=>{
        const n=JSON.parse(JSON.stringify(p));
        const pb=n.passboxes.find(x=>x.id===id);
        if(!pb||(pb.status!=='idle'&&pb.status!=='done')) return p;
        pb.status='transferring'; pb.sample=sid; pb.updated_at=new Date().toISOString();
        n.sample_log.push({ts:new Date().toISOString(),sample:sid,passbox:pb.name,from_room:from,to_room:to,event:'transfer_start'});
        return n;
      });
      setTimeout(()=>setState(p=>{
        const n=JSON.parse(JSON.stringify(p));
        const pb=n.passboxes.find(x=>x.id===id);
        if(pb&&pb.status==='transferring'){pb.status='disinfecting';pb.updated_at=new Date().toISOString();}
        return n;
      }),2000);
      setTimeout(()=>setState(p=>{
        const n=JSON.parse(JSON.stringify(p));
        const pb=n.passboxes.find(x=>x.id===id);
        if(pb&&pb.status==='disinfecting'){
          pb.status='done'; pb.updated_at=new Date().toISOString();
          n.sample_log.push({ts:new Date().toISOString(),sample:pb.sample,passbox:pb.name,from_room:from,to_room:to,event:'transfer_done'});
        }
        return n;
      }),5000);
    } else if(type==='reset'){
      setState(p=>{
        const n=JSON.parse(JSON.stringify(p));
        const pb=n.passboxes.find(x=>x.id===id);
        if(pb){pb.status='idle';pb.sample=null;pb.updated_at=new Date().toISOString();}
        return n;
      });
    } else if(type==='ac_start'){
      setState(p=>{
        const n=JSON.parse(JSON.stringify(p));
        const ac=n.autoclaves[id];
        if(ac&&(ac.status==='idle'||ac.status==='done')){ac.status='running';ac.countdown=60;ac.temp=121.0;}
        return n;
      });
    } else if(type==='ac_reset'){
      setState(p=>{
        const n=JSON.parse(JSON.stringify(p));
        const ac=n.autoclaves[id];
        if(ac){ac.status='idle';ac.countdown=0;ac.temp=25.0;}
        return n;
      });
    }
  },[]);

  const alarmN=state.rooms.filter(r=>r.status==='alarm').length;
  const warnN =state.rooms.filter(r=>r.status==='warning').length;
  const cleanR=state.rooms.filter(r=>r.zone==='clean');
  const logs  =state.sample_log;

  return (
    <div style={{display:'flex',flexDirection:'column',height:'100vh',overflow:'hidden'}}>
      {/* 顶部栏 */}
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',
        padding:'9px 20px',background:'#0d1117',borderBottom:'1px solid #161b22',flexShrink:0}}>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          <div style={{width:34,height:34,borderRadius:8,background:'linear-gradient(135deg,#22c55e,#16a34a)',
            display:'flex',alignItems:'center',justifyContent:'center',fontSize:18}}>🧬</div>
          <div>
            <div style={{fontSize:15,fontWeight:700,letterSpacing:'0.02em'}}>Mini-LIMS</div>
            <div style={{fontSize:10,color:'#6b7280'}}> 微生物实验室 · 数字孪生系统 v3.0 · 图纸精准版</div>
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:12}}>
          {alarmN>0&&(
            <div style={{display:'flex',alignItems:'center',gap:6,padding:'4px 12px',
              background:'#2b0a0a',border:'1px solid #ef4444',borderRadius:20}}>
              <span style={{width:8,height:8,borderRadius:'50%',background:'#ef4444',display:'inline-block',animation:'blink 1s infinite'}}/>
              <span style={{color:'#f87171',fontSize:12,fontWeight:600}}>{alarmN} 告警</span>
            </div>
          )}
          {warnN>0&&(
            <div style={{padding:'4px 12px',background:'#2b1f00',border:'1px solid #f59e0b',borderRadius:20}}>
              <span style={{color:'#fbbf24',fontSize:12,fontWeight:600}}>⚠ {warnN} 警告</span>
            </div>
          )}
          <div style={{display:'flex',alignItems:'center',gap:6}}>
            <span style={{width:8,height:8,borderRadius:'50%',background:'#22c55e',display:'inline-block'}}/>
            <span style={{color:'#6b7280',fontSize:12}}>实时模拟 · {new Date(state.ts).toLocaleTimeString()}</span>
          </div>
        </div>
      </div>

      {/* 主体 */}
      <div style={{flex:1,display:'flex',overflow:'hidden'}}>
        <div style={{flex:1,padding:12,overflow:'hidden'}}>
          <LabMap data={state} onSelect={(type,d)=>setModal({type,data:d})}/>
        </div>
        {/* 日志栏 */}
        <div style={{width:235,flexShrink:0,background:'#0d1117',borderLeft:'1px solid #161b22',display:'flex',flexDirection:'column'}}>
          <div style={{padding:'12px 14px',borderBottom:'1px solid #161b22'}}>
            <h3 style={{fontSize:12,fontWeight:700,color:'#6b7280',letterSpacing:'0.05em'}}>📋 样品流转日志</h3>
          </div>
          <div style={{flex:1,overflowY:'auto',padding:'4px 0'}}>
            {logs.length===0&&(
              <p style={{color:'#21262d',fontSize:12,textAlign:'center',marginTop:50,lineHeight:2}}>暂无记录<br/>点击传递窗启动传递</p>
            )}
            {[...logs].reverse().map((log,i)=>{
              const col={transfer_start:'#f59e0b',transfer_done:'#22c55e'}[log.event]||'#64748b';
              const elbl={transfer_start:'开始传递',transfer_done:'传递完成'}[log.event]||log.event;
              return (
                <div key={i} className="log-item" style={{padding:'9px 14px',borderBottom:'1px solid #0d1117'}}>
                  <div style={{display:'flex',justifyContent:'space-between',marginBottom:3}}>
                    <span style={{fontSize:12,fontWeight:700,color:col}}>{log.sample}</span>
                    <span style={{fontSize:10,color:'#21262d'}}>{new Date(log.ts).toLocaleTimeString()}</span>
                  </div>
                  <div style={{fontSize:11,color:'#6b7280',marginBottom:4}}>{log.from_room} → {log.to_room}</div>
                  <span style={{display:'inline-block',padding:'1px 8px',borderRadius:10,
                    background:col+'22',border:`1px solid ${col}`,color:col,fontSize:10,fontWeight:600}}>{elbl}</span>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {/* 底部环境条 */}
      <div style={{display:'flex',background:'#0d1117',borderTop:'1px solid #161b22',
        padding:'6px 20px',overflowX:'auto',flexShrink:0,alignItems:'center',gap:0}}>
        {cleanR.map(r=>{
          const col={normal:'#22c55e',warning:'#f59e0b',alarm:'#ef4444'}[r.status]||'#64748b';
          return (
            <div key={r.id} style={{display:'flex',alignItems:'center',gap:8,
              padding:'3px 16px',borderRight:'1px solid #161b22',flexShrink:0}}>
              <span style={{color:'#6b7280',fontSize:11}}>{r.name}</span>
              <span style={{color:col,fontSize:12,fontWeight:700}}>{r.pressure>0?'+':''}{r.pressure} Pa</span>
              <span style={{color:'#374151',fontSize:11}}>{r.temp}℃</span>
              <span style={{color:'#374151',fontSize:11}}>{r.humidity}%RH</span>
              <span style={{color:'#1e2530',fontSize:11}}>{r.noise}dB</span>
            </div>
          );
        })}
        <div style={{marginLeft:'auto',flexShrink:0}}>
          <span style={{color:'#1e2530',fontSize:11}}>Mini-LIMS v3.0 · 20m×11m 图纸精准版</span>
        </div>
      </div>

      {/* 弹窗 */}
      {modal&&(
        <div style={{position:'fixed',inset:0,background:'rgba(0,0,0,0.78)',
          display:'flex',alignItems:'center',justifyContent:'center',zIndex:1000}}
          onClick={e=>e.target===e.currentTarget&&setModal(null)}>
          {modal.type==='room'      &&<RoomPanel   room={modal.data} onClose={()=>setModal(null)}/>}
          {modal.type==='passbox'   &&<PassboxPanel pb={modal.data}  onClose={()=>setModal(null)} onAction={act}/>}
          {modal.type==='incubator' &&<IncPanel     inc={modal.data} onClose={()=>setModal(null)}/>}
          {modal.type==='autoclave' &&<AcPanel      ac={modal.data}  onClose={()=>setModal(null)} onAction={act}/>}
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
